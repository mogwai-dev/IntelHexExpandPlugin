name: build-x64

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build x64 release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/intel_hex_expand.dll dist/IntelHexExpand.dll
          Compress-Archive -Path dist/IntelHexExpand.dll -DestinationPath dist/IntelHexExpandPlugin-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = $metadata.packages[0].version
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer/IntelHexExpandPlugin.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelHexExpandPlugin-x64
          path: |
            dist/IntelHexExpand.dll
            dist/IntelHexExpandPlugin-x64.zip
            dist/IntelHexExpandPlugin-x64-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IntelHexExpandPlugin-x64.zip
            dist/IntelHexExpand.dll
            dist/IntelHexExpandPlugin-x64-setup.exe
          generate_release_notes: true
