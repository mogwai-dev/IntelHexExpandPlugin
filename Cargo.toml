[package]
name = "intel_hex_expand"
version = "0.1.0"
edition = "2021"
description = "WinMerge FILE_PACK_UNPACK plugin for Intel HEX expansion (x64 only)"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices"
] }

[build-dependencies]
embed-resource = "2.5.2"
